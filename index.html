<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Tuần này ăn gì?</title>
<style>
:root{--ink:#17171f;--mute:#6b7069;--rule:#c9cbc2;--bg:#fff;--acc:#1f8a4c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.45 -apple-system,"Helvetica Neue",sans-serif}
main{max-width:640px;margin:0 auto;padding:28px 20px 110px}
h1{font:700 44px/1.05 "New York","Iowan Old Style",Georgia,serif;margin:0 0 22px;letter-spacing:-.02em;transform:rotate(-1.5deg);transform-origin:left}
.row{display:flex;flex-wrap:wrap;gap:4px 18px;margin:0 0 14px;align-items:baseline}
.row>span:not(.lab){display:flex;flex-wrap:wrap;gap:10px}
.lab{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);width:100%;margin-top:6px}
button.t{background:#fff;border:2px solid var(--ink);border-radius:999px;padding:8px 16px;min-height:44px;font:inherit;font-size:16px;color:var(--ink);cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
button.t:active{transform:translate(2px,2px);box-shadow:none}
button.t.on{background:var(--ink);color:#fff;font-weight:700;box-shadow:2px 2px 0 var(--acc)}
#go{display:block;width:100%;margin:22px 0 8px;padding:16px;border:0;background:var(--ink);color:#fff;font:700 22px "New York",Georgia,serif;border-radius:40px;box-shadow:4px 4px 0 var(--acc);transition:transform .1s,box-shadow .1s}
#go:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--acc)}
ol{list-style:none;margin:20px 0 0;padding:0;border-top:2px solid var(--ink)}
li{padding:16px 0 8px;border-bottom:1px solid var(--rule)}
.win{height:108px;overflow:hidden;background:#f4f4f1;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);margin-top:6px}
.win.lock{border-color:var(--acc);background:#e8f6ec}
.strip{will-change:transform}
.strip.blur{filter:blur(1.2px)}
.it{height:108px;padding:10px;display:grid;grid-template-columns:1fr 104px;gap:12px;align-items:center}
.ph{height:58px;display:flex;align-items:center;justify-content:center;font-size:34px;background:#fff;border:2px solid var(--ink)}
.em{font-size:24px;margin-right:6px;vertical-align:-2px}
.day{font:700 17px "New York",Georgia,serif;color:var(--acc)}
.name{font:500 17px/1.28 "New York","Iowan Old Style",Georgia,serif;color:var(--ink);text-decoration:none;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cat{font-size:13px;color:var(--mute);margin-top:3px}
img{border:2px solid var(--ink);width:104px;aspect-ratio:16/9;object-fit:cover;display:block;background:#ddd}
.act{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 6px}
.act button{background:#fff;border:2px solid var(--ink);border-radius:999px;padding:6px 14px;min-height:40px;font:inherit;font-size:15px;color:var(--ink)}
.act button:active{background:#eee}
.act button.on{background:var(--ink);color:#fff;font-weight:700}
.act button[data-a=add]{border-color:var(--acc);color:var(--acc)}
.act button[data-a=re]{border-color:var(--acc);color:var(--acc)}
.rr{display:grid;grid-template-columns:1fr 104px;gap:12px;padding:14px 0 6px;border-bottom:1px solid var(--rule)}
.rr .act{margin-top:4px}
#list,#favs{border-top:2px solid var(--ink);margin-top:14px}
#q{width:100%;border:0;border-bottom:2px solid var(--ink);background:none;outline:none;border-radius:0;font:500 24px "New York",Georgia,serif;padding:10px 0;color:var(--ink)}
.empty{color:var(--mute);margin:24px 0}
#more{display:block;margin:18px 0 0;background:none;border:0;font:inherit;color:var(--acc);text-decoration:underline;padding:8px 0}
h2{font:700 22px "New York",Georgia,serif;margin:30px 0 0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:2px solid var(--ink);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;padding:10px 0 9px;font:600 14px -apple-system,sans-serif;color:var(--mute);line-height:1.3}
nav button span{display:block;font-size:22px}
nav button.on{color:var(--ink);box-shadow:inset 0 3px 0 var(--acc)}
</style>
</head>

<main>

const pick=a=>a[Math.floor(Math.random()*a.length)];
const fresh=id=>!(st.cooked[id]&&Date.now()-st.cooked[id]<30*864e5);
const pool=()=>{const p=R.filter(r=>st.cats.length?st.cats.includes(r[2]):!SIDE.includes(r[2]));const q=p.filter(r=>fresh(r[0]));return q.length>=st.n?q:p};

function roll(){
  const p0=pool(),L=Array(st.n).fill(null);
  st.list.forEach((id,i)=>{if(i<st.n&&st.locked.includes(id))L[i]=id});
  const taken=new Set(L.filter(Boolean));let used=new Set([...taken].map(id=>byId[id][2]));
  for(let i=0;i<L.length;i++){
    if(L[i])continue;
    const p=p0.filter(r=>!taken.has(r[0]));if(!p.length)break;
    let cs=[...new Set(p.map(r=>r[2]))].filter(c=>!used.has(c));
    if(!cs.length){used=new Set();cs=[...new Set(p.map(r=>r[2]))]}
    const c=pick(cs);used.add(c);
    const r=pick(p.filter(r=>r[2]==c));L[i]=r[0];taken.add(r[0]);
  }
  st.list=L.filter(Boolean);
}

const favBtn=id=>`<button data-a="fav" data-id="${id}" class="${st.fav.includes(id)?"on":""}">${st.fav.includes(id)?"❤️ Đã thích":"🤍 Thích"}</button>`;
const cookBtn=id=>`<button data-a="cook" data-id="${id}" class="${st.cooked[id]?"on":""}">${st.cooked[id]?"✓ Đã nấu":"Đã nấu?"}</button>`;
const plain=id=>{const r=byId[id];return `<div class="rr"><div><a class="name" href="${url(id)}">${r[1]}</a><div class="cat">${EM[r[2]]} ${r[2]}</div><div class="act"><button data-a="add" data-id="${id}">＋ Thêm</button>${favBtn(id)}${cookBtn(id)}</div></div><a href="${url(id)}"><img loading="lazy" src="https://i.ytimg.com/vi/${id}/mqdefault.jpg" alt=""></a></div>`};

function renderMenu(){
  n.innerHTML=[3,5,7].map(k=>`<button class="t ${k==st.n?"on":""}" data-n="${k}">${k} món</button>`).join("");
  c.innerHTML=["Bữa cơm",...CATS].map(k=>`<button class="t ${(k=="Bữa cơm"?!st.cats.length:st.cats.includes(k))?"on":""}" data-c="${k}">${k}</button>`).join("");
  out.innerHTML=st.list.length?`<ol>${st.list.slice(0,st.n).map((id,i)=>{const lk=st.locked.includes(id);return `<li><div class="day"><span class="em">${EM[byId[id][2]]}</span>Món ${i+1}</div><div class="win ${lk?"lock":""}"><div class="strip">${item(id,1)}</div></div><div class="act">${lk?"":`<button data-a="re" data-i="${i}">↻ Đổi món</button>`}<button data-a="lock" data-id="${id}" class="${lk?"on":""}">${lk?"🔒 Đã giữ":"🔓 Giữ món"}</button>${favBtn(id)}${cookBtn(id)}</div></li>`}).join("")}</ol>`:"";
}
function spin(which){
  const all=R.map(r=>r[0]),H=108,K=14;
  document.querySelectorAll(".strip").forEach((el,i)=>{
    if(which?!which.includes(i):st.locked.includes(st.list[i]))return;
    const d=1.2+(which?0:i*.3);
    let h="";for(let k=0;k<K;k++)h+=item(pick(all),0);
    el.innerHTML=h+item(st.list[i],1);
    el.style.transition="none";el.style.transform="translateY(0)";el.offsetHeight;
    el.classList.add("blur");
    el.style.transition=`transform ${d}s cubic-bezier(.12,.7,.15,1)`;
    el.style.transform=`translateY(${-K*H}px)`;
    setTimeout(()=>el.classList.remove("blur"),d*650);
  });
}
let lim=40;
function renderFind(){
  const t=fold(q.value.trim()),m=R.filter((r,i)=>idx[i].includes(t));
  list.innerHTML=m.length?m.slice(0,lim).map(r=>plain(r[0])).join(""):`<p class="empty">Không tìm thấy món nào.</p>`;
  more.hidden=m.length<=lim;
}
function renderFav(){
  favs.innerHTML=st.fav.length?[...st.fav].reverse().map(plain).join(""):`<p class="empty">Bấm 🤍 ở món bạn thích, món đó sẽ nằm ở đây.</p>`;
  const d=Object.keys(st.cooked).sort((a,b)=>st.cooked[b]-st.cooked[a]);
  done.innerHTML=d.length?d.map(plain).join(""):`<p class="empty">Chưa có món nào. Bấm "Đã nấu?" sau khi nấu xong. Món đã nấu sẽ không bị chọn lại trong 30 ngày.</p>`;
}
let tab="menu";
function show(t){
  tab=t;
  ["menu","find","fav"].forEach(k=>document.getElementById("v-"+k).hidden=k!=t);
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab==t));
  draw();scrollTo(0,0);
}
function draw(){tab=="menu"?renderMenu():tab=="find"?renderFind():renderFav()}

document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.tab)return show(b.dataset.tab);
  if(b.id=="more"){lim+=40;return renderFind()}
  const a=b.dataset.a,id=b.dataset.id;let which;
  if(b.dataset.n){st.n=+b.dataset.n;if(st.list.length)roll();else{save();return renderMenu()}}
  else if(b.dataset.c){const k=b.dataset.c;st.cats=k=="Bữa cơm"?[]:st.cats.includes(k)?st.cats.filter(x=>x!=k):[...st.cats,k];if(st.list.length)roll();else{save();return renderMenu()}}
  else if(b.id=="go")roll();
  else if(a=="re"){const p=pool().filter(r=>!st.list.includes(r[0]));if(!p.length)return;which=[+b.dataset.i];st.list[which[0]]=pick(p)[0]}
  else if(a=="lock"){st.locked=st.locked.includes(id)?st.locked.filter(x=>x!=id):[...st.locked,id];save();return draw()}
  else if(a=="fav"){st.fav=st.fav.includes(id)?st.fav.filter(x=>x!=id):[...st.fav,id];save();return draw()}
  else if(a=="cook"){st.cooked[id]?delete st.cooked[id]:st.cooked[id]=Date.now();save();return draw()}
  else if(a=="add"){
    if(!st.list.includes(id)){
      if(st.list.length<st.n)st.list.push(id);
      else{let i=st.list.findIndex(x=>!st.locked.includes(x));if(i<0)i=st.list.length-1;st.locked=st.locked.filter(x=>x!=st.list[i]);st.list[i]=id}
      if(!st.locked.includes(id))st.locked.push(id);
    }
    save();return show("menu");
  }
  else return;
  save();renderMenu();spin(which);
});
q.addEventListener("input",()=>{lim=40;renderFind()});
renderMenu();
</script>
</body>
</html>
